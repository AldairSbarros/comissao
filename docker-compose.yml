name: financeiro

services:
  backend:
    container_name: financeiro_backend
    build:
      context: ./financeiro-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - OCR_PROVIDER=${OCR_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OCR_GEMINI_MODEL=${OCR_GEMINI_MODEL:-gemini-2.0-flash}
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - META_API_URL=${META_API_URL:-https://api.meta.ai/v1}
      - OCR_MUSE_MODEL=${OCR_MUSE_MODEL:-muse-spark-1.3}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-}
      - EVOLUTION_FORWARD_WEBHOOK_URL=${EVOLUTION_FORWARD_WEBHOOK_URL:-}
    ports:
      - "8001:8000"
    volumes:
      - ./financeiro_data:/app/data
    networks:
      - financeiro_network

  frontend:
    container_name: financeiro_frontend
    build:
      context: ./financeiro-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /financeiro/api 
    restart: unless-stopped
    ports:
      - "3004:3000"
    depends_on:
      - backend
    networks:
      - financeiro_network

networks:
  financeiro_network:
    driver: bridge
